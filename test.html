<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transaction Form</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ----- Reset & Base ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, #f6f9fc 0%, #eef2f7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }

        /* ----- Card Container ----- */
        .form-card {
            max-width: 720px;
            width: 100%;
            background: #ffffff;
            border-radius: 2rem;
            box-shadow: 0 20px 60px rgba(0, 20, 40, 0.12), 0 8px 24px rgba(0, 0, 0, 0.04);
            padding: 2.5rem 2.8rem;
            transition: all 0.2s ease;
        }

        /* ----- Header ----- */
        .form-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
        }

        .form-header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #0b1a2e;
            letter-spacing: -0.02em;
        }

        .form-header h1 i {
            color: #2a7de1;
            margin-right: 10px;
        }

        .badge {
            background: #eef5ff;
            color: #1a5bbf;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.3rem 0.9rem;
            border-radius: 100px;
            letter-spacing: 0.3px;
        }

        /* ----- Form Elements ----- */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1e2f44;
            margin-bottom: 0.4rem;
            letter-spacing: 0.2px;
        }

        label .required {
            color: #d14545;
            margin-left: 2px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            font-family: inherit;
            background: #f8fafd;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            transition: 0.2s ease;
            color: #0b1a2e;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2a7de1;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(42, 125, 225, 0.12);
        }

        input::placeholder,
        textarea::placeholder {
            color: #9aabbb;
            font-weight: 400;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* ----- Type Toggle (Income / Expense) ----- */
        .type-toggle {
            display: flex;
            gap: 0.75rem;
            background: #f1f5f9;
            border-radius: 14px;
            padding: 0.4rem;
            border: 1.5px solid #e2e8f0;
        }

        .type-option {
            flex: 1;
            text-align: center;
            padding: 0.6rem 0.2rem;
            border-radius: 11px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s ease;
            color: #4a5c72;
            background: transparent;
            border: none;
            font-family: inherit;
            letter-spacing: 0.2px;
        }

        .type-option i {
            margin-right: 6px;
        }

        .type-option.active-income {
            background: #ffffff;
            color: #0b7e3d;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(11, 126, 61, 0.15);
        }

        .type-option.active-expense {
            background: #ffffff;
            color: #b13a3a;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(177, 58, 58, 0.15);
        }

        .type-option:hover:not(.active-income):not(.active-expense) {
            background: #e9eef5;
        }

        /* ----- Amount input with currency symbol ----- */
        .amount-wrapper {
            position: relative;
        }

        .amount-wrapper .currency-symbol {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            font-weight: 600;
            color: #4a5c72;
            font-size: 1rem;
        }

        .amount-wrapper input {
            padding-left: 2.2rem;
        }

        /* ----- Submit Button ----- */
        .btn-submit {
            width: 100%;
            padding: 0.9rem 1.5rem;
            background: #0b1a2e;
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 0.5rem;
            letter-spacing: 0.3px;
            font-family: inherit;
        }

        .btn-submit i {
            font-size: 1.1rem;
        }

        .btn-submit:hover {
            background: #142b44;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(11, 26, 46, 0.20);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* ----- Transaction List (demo) ----- */
        .transaction-list {
            margin-top: 2.5rem;
            border-top: 1.5px solid #eef2f7;
            padding-top: 1.8rem;
        }

        .transaction-list .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .transaction-list .list-header h3 {
            font-size: 1rem;
            font-weight: 600;
            color: #1e2f44;
        }

        .transaction-list .list-header span {
            font-size: 0.8rem;
            color: #6b7f94;
            background: #f1f5f9;
            padding: 0.2rem 0.8rem;
            border-radius: 100px;
        }

        .tx-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fafcff;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            border: 1px solid #eef2f7;
            margin-bottom: 0.6rem;
            transition: 0.15s ease;
        }

        .tx-item:hover {
            background: #f5f9ff;
            border-color: #dce5f0;
        }

        .tx-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .tx-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            background: #eef5ff;
            color: #1a5bbf;
        }

        .tx-icon.income {
            background: #e3f3e9;
            color: #0b7e3d;
        }

        .tx-icon.expense {
            background: #fce8e8;
            color: #b13a3a;
        }

        .tx-info {
            display: flex;
            flex-direction: column;
        }

        .tx-info .tx-category {
            font-weight: 500;
            color: #0b1a2e;
            font-size: 0.9rem;
        }

        .tx-info .tx-meta {
            font-size: 0.75rem;
            color: #6b7f94;
            display: flex;
            gap: 10px;
            margin-top: 2px;
        }

        .tx-amount {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .tx-amount.income {
            color: #0b7e3d;
        }

        .tx-amount.expense {
            color: #b13a3a;
        }

        .empty-state {
            text-align: center;
            padding: 1.8rem 0.5rem;
            color: #8a9eb0;
            font-size: 0.9rem;
        }

        .empty-state i {
            font-size: 2.2rem;
            color: #d0dce8;
            margin-bottom: 0.5rem;
            display: block;
        }

        /* ----- Responsive ----- */
        @media (max-width: 600px) {
            .form-card {
                padding: 1.8rem 1.2rem;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0.8rem;
            }

            .form-header h1 {
                font-size: 1.4rem;
            }

            .type-option {
                font-size: 0.8rem;
                padding: 0.5rem 0.2rem;
            }

            .tx-item {
                flex-wrap: wrap;
                gap: 6px;
            }

            .tx-left {
                width: 100%;
            }

            .tx-amount {
                margin-left: auto;
            }
        }

        @media (max-width: 400px) {
            .form-card {
                padding: 1.2rem 0.8rem;
            }

            .type-toggle {
                flex-direction: column;
                gap: 0.4rem;
            }

            .btn-submit {
                font-size: 0.9rem;
                padding: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="form-card">

        <!-- Header -->
        <div class="form-header">
            <h1><i class="fas fa-receipt"></i> New Transaction</h1>
            <span class="badge"><i class="far fa-calendar-alt"></i> Today</span>
        </div>

        <!-- Form -->
        <form id="transactionForm" autocomplete="off">

            <!-- Type Toggle -->
            <div class="form-group">
                <label>Transaction type <span class="required">*</span></label>
                <div class="type-toggle" id="typeToggle">
                    <button type="button" class="type-option active-income" data-type="income">
                        <i class="fas fa-arrow-up"></i> Income
                    </button>
                    <button type="button" class="type-option" data-type="expense">
                        <i class="fas fa-arrow-down"></i> Expense
                    </button>
                </div>
                <input type="hidden" name="type" id="transactionType" value="income" />
            </div>

            <!-- Row: Amount + Category -->
            <div class="form-row">
                <div class="form-group">
                    <label for="amount">Amount <span class="required">*</span></label>
                    <div class="amount-wrapper">
                        <span class="currency-symbol">$</span>
                        <input type="number" id="amount" name="amount" placeholder="0.00" step="0.01" min="0.01" required />
                    </div>
                </div>
                <div class="form-group">
                    <label for="category">Category <span class="required">*</span></label>
                    <select id="category" name="category" required>
                        <option value="" disabled selected>Select category</option>
                        <option value="salary">Salary</option>
                        <option value="freelance">Freelance</option>
                        <option value="investment">Investment</option>
                        <option value="food">Food & Dining</option>
                        <option value="transport">Transport</option>
                        <option value="shopping">Shopping</option>
                        <option value="bills">Bills & Utilities</option>
                        <option value="health">Health</option>
                        <option value="entertainment">Entertainment</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>

            <!-- Row: Date + Payment Method -->
            <div class="form-row">
                <div class="form-group">
                    <label for="date">Date <span class="required">*</span></label>
                    <input type="date" id="date" name="date" required />
                </div>
                <div class="form-group">
                    <label for="payment">Payment method</label>
                    <select id="payment" name="payment">
                        <option value="cash">Cash</option>
                        <option value="credit_card">Credit Card</option>
                        <option value="debit_card">Debit Card</option>
                        <option value="bank_transfer">Bank Transfer</option>
                        <option value="paypal">PayPal</option>
                        <option value="crypto">Cryptocurrency</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>

            <!-- Note -->
            <div class="form-group">
                <label for="note">Note</label>
                <textarea id="note" name="note" placeholder="Add a note (optional)"></textarea>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-submit">
                <i class="fas fa-plus-circle"></i> Add Transaction
            </button>
        </form>

        <!-- Transaction List (demo preview) -->
        <div class="transaction-list">
            <div class="list-header">
                <h3><i class="fas fa-list-ul" style="margin-right: 8px; color:#2a7de1;"></i>Recent transactions</h3>
                <span>3 entries</span>
            </div>

            <div id="transactionList">
                <!-- Items will be injected by JS -->
            </div>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // ----- DOM refs -----
            const form = document.getElementById('transactionForm');
            const typeToggle = document.getElementById('typeToggle');
            const typeInput = document.getElementById('transactionType');
            const amountInput = document.getElementById('amount');
            const categorySelect = document.getElementById('category');
            const dateInput = document.getElementById('date');
            const paymentSelect = document.getElementById('payment');
            const noteInput = document.getElementById('note');
            const listContainer = document.getElementById('transactionList');

            // ----- Set default date to today -----
            const today = new Date().toISOString().split('T')[0];
            dateInput.value = today;

            // ----- Type toggle logic -----
            const typeOptions = typeToggle.querySelectorAll('.type-option');

            function setActiveType(type) {
                typeOptions.forEach(btn => {
                    btn.classList.remove('active-income', 'active-expense');
                    if (btn.dataset.type === type) {
                        btn.classList.add(type === 'income' ? 'active-income' : 'active-expense');
                    }
                });
                typeInput.value = type;
            }

            typeOptions.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const type = this.dataset.type;
                    setActiveType(type);
                });
            });

            // ----- Sample data (initial) -----
            let transactions = [{
                id: 1,
                type: 'income',
                amount: 2450.00,
                category: 'Salary',
                date: '2026-07-24',
                payment: 'Bank Transfer',
                note: 'Monthly salary'
            }, {
                id: 2,
                type: 'expense',
                amount: 128.50,
                category: 'Food & Dining',
                date: '2026-07-25',
                payment: 'Credit Card',
                note: 'Dinner at Stefano\'s'
            }, {
                id: 3,
                type: 'expense',
                amount: 45.00,
                category: 'Transport',
                date: '2026-07-26',
                payment: 'Debit Card',
                note: 'Gas station'
            }];

            let nextId = 4;

            // ----- Render list -----
            function renderTransactions() {
                if (transactions.length === 0) {
                    listContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-inbox"></i>
                            No transactions yet — add one above!
                        </div>
                    `;
                    return;
                }

                let html = '';
                // show latest first
                const sorted = [...transactions].reverse();
                sorted.forEach(tx => {
                    const isIncome = tx.type === 'income';
                    const iconClass = isIncome ? 'income' : 'expense';
                    const icon = isIncome ? 'fa-arrow-up' : 'fa-arrow-down';
                    const sign = isIncome ? '+' : '-';
                    const amountClass = isIncome ? 'income' : 'expense';

                    const dateObj = new Date(tx.date + 'T00:00:00');
                    const dateStr = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric',
                        year: 'numeric' });

                    html += `
                        <div class="tx-item">
                            <div class="tx-left">
                                <div class="tx-icon ${iconClass}">
                                    <i class="fas ${icon}"></i>
                                </div>
                                <div class="tx-info">
                                    <span class="tx-category">${tx.category}</span>
                                    <span class="tx-meta">
                                        <span><i class="far fa-calendar-alt"></i> ${dateStr}</span>
                                        <span><i class="fas fa-credit-card"></i> ${tx.payment || '—'}</span>
                                    </span>
                                </div>
                            </div>
                            <div class="tx-amount ${amountClass}">
                                ${sign}$${tx.amount.toFixed(2)}
                            </div>
                        </div>
                    `;
                });

                listContainer.innerHTML = html;
                // update badge count
                const badge = document.querySelector('.list-header span');
                if (badge) badge.textContent = `${transactions.length} entries`;
            }

            // ----- Add transaction -----
            function addTransaction(event) {
                event.preventDefault();

                // Gather data
                const type = typeInput.value;
                const amount = parseFloat(amountInput.value);
                const category = categorySelect.value;
                const date = dateInput.value;
                const payment = paymentSelect.value;
                const note = noteInput.value.trim();

                // Validations
                if (!amount || amount <= 0) {
                    alert('Please enter a valid amount greater than 0.');
                    amountInput.focus();
                    return;
                }

                if (!category) {
                    alert('Please select a category.');
                    categorySelect.focus();
                    return;
                }

                if (!date) {
                    alert('Please select a date.');
                    dateInput.focus();
                    return;
                }

                // Create transaction object
                const newTx = {
                    id: nextId++,
                    type: type,
                    amount: amount,
                    category: category,
                    date: date,
                    payment: payment,
                    note: note || '—'
                };

                transactions.push(newTx);
                renderTransactions();

                // Reset form (keep type and date)
                amountInput.value = '';
                categorySelect.value = '';
                paymentSelect.value = 'cash';
                noteInput.value = '';
                // keep date as today or whatever was set
                // keep type as is

                // Re-focus amount for quick entry
                amountInput.focus();

                // Optional: subtle feedback
                const submitBtn = form.querySelector('.btn-submit');
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<i class="fas fa-check-circle"></i> Added!';
                submitBtn.style.background = '#0b7e3d';
                setTimeout(() => {
                    submitBtn.innerHTML = originalText;
                    submitBtn.style.background = '';
                }, 1200);
            }

            // ----- Form submit -----
            form.addEventListener('submit', addTransaction);

            // ----- Init render -----
            renderTransactions();

            // ----- Set default active type (income) -----
            setActiveType('income');

            // ----- Keyboard shortcut: press "i" or "e" to toggle type -----
            document.addEventListener('keydown', function(e) {
                // only if not inside input/textarea
                const tag = e.target.tagName.toLowerCase();
                if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

                if (e.key === 'i' || e.key === 'I') {
                    e.preventDefault();
                    setActiveType('income');
                } else if (e.key === 'e' || e.key === 'E') {
                    e.preventDefault();
                    setActiveType('expense');
                }
            });

        })();
    </script>

</body>
</html>
