<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendar Dashboard</title>
    <!-- Font Awesome for icons (optional but adds polish) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ---------- MAIN CARD ---------- */
        .calendar-dashboard {
            max-width: 1100px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            flex-wrap: wrap;
            transition: all 0.2s;
        }

        /* ---------- SIDEBAR (Upcoming Events) ---------- */
        .sidebar {
            width: 280px;
            background: #f8faff;
            padding: 32px 24px 28px;
            border-right: 1px solid #eef1f6;
            flex-shrink: 0;
        }

        .sidebar-title {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #7a7f8a;
            margin-bottom: 20px;
        }

        .event-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .event-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 12px;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            border: 1px solid #eef1f6;
            transition: 0.15s;
            cursor: default;
        }

        .event-item:hover {
            border-color: #d0d7e5;
            background: #fcfdff;
        }

        /* coloured dots */
        .event-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .event-dot.orange {
            background: #f97316;
        }
        .event-dot.green {
            background: #22c55e;
        }
        .event-dot.blue {
            background: #3b82f6;
        }
        .event-dot.purple {
            background: #8b5cf6;
        }
        .event-dot.pink {
            background: #ec4899;
        }
        .event-dot.teal {
            background: #14b8a6;
        }
        .event-dot.red {
            background: #ef4444;
        }

        .event-info {
            flex: 1;
            min-width: 0;
        }

        .event-name {
            font-size: 15px;
            font-weight: 500;
            color: #1e1f28;
            line-height: 1.3;
        }

        .event-sub {
            font-size: 12px;
            color: #8b90a0;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .event-date-badge {
            font-size: 12px;
            font-weight: 500;
            color: #4b4f5e;
            background: #f0f2f6;
            padding: 4px 10px;
            border-radius: 20px;
            white-space: nowrap;
        }

        /* ---------- MAIN CALENDAR ---------- */
        .main {
            flex: 1;
            min-width: 0;
            padding: 32px 28px 28px;
            background: #ffffff;
        }

        /* header / month picker */
        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .month-year {
            font-size: 22px;
            font-weight: 600;
            color: #0b0c12;
            letter-spacing: -0.3px;
        }

        .month-year span {
            color: #7a7f8a;
            font-weight: 400;
        }

        .nav-buttons {
            display: flex;
            gap: 6px;
        }

        .nav-btn {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            border: 1px solid #e4e8ef;
            background: #ffffff;
            color: #2d313e;
            font-size: 16px;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-btn:hover {
            background: #f3f6fc;
            border-color: #c8d0df;
        }

        .nav-btn:active {
            background: #e6ebf5;
        }

        /* weekday headers */
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: #7a7f8a;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 12px;
            padding: 0 4px;
        }

        /* days grid */
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .day-cell {
            aspect-ratio: 1 / 1;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 500;
            color: #1e1f28;
            background: #ffffff;
            transition: 0.1s;
            position: relative;
            cursor: default;
            padding: 4px 0;
            min-height: 52px;
        }

        .day-cell.other-month {
            color: #b8bdc9;
        }

        .day-cell.today {
            background: #eef3fe;
            font-weight: 600;
            color: #1a4cba;
        }

        /* event indicators inside day cells */
        .day-cell .indicators {
            display: flex;
            gap: 3px;
            margin-top: 2px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .day-cell .indicator-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }

        .indicator-dot.orange {
            background: #f97316;
        }
        .indicator-dot.green {
            background: #22c55e;
        }
        .indicator-dot.blue {
            background: #3b82f6;
        }
        .indicator-dot.purple {
            background: #8b5cf6;
        }
        .indicator-dot.pink {
            background: #ec4899;
        }
        .indicator-dot.teal {
            background: #14b8a6;
        }
        .indicator-dot.red {
            background: #ef4444;
        }

        /* ---------- LEGEND ---------- */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 18px 28px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #eef1f6;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 450;
            color: #2d313e;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .legend-dot.orange {
            background: #f97316;
        }
        .legend-dot.green {
            background: #22c55e;
        }
        .legend-dot.blue {
            background: #3b82f6;
        }
        .legend-dot.purple {
            background: #8b5cf6;
        }
        .legend-dot.pink {
            background: #ec4899;
        }
        .legend-dot.teal {
            background: #14b8a6;
        }
        .legend-dot.red {
            background: #ef4444;
        }

        /* ---------- TIP ---------- */
        .tip {
            margin-top: 18px;
            padding: 14px 18px;
            background: #f7f9fe;
            border-radius: 14px;
            font-size: 14px;
            color: #3d4353;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #eaeef7;
        }

        .tip i {
            color: #3b82f6;
            font-size: 18px;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 820px) {
            .sidebar {
                width: 100%;
                border-right: 0;
                border-bottom: 1px solid #eef1f6;
                padding: 24px 20px 20px;
            }

            .main {
                padding: 24px 18px 20px;
            }

            .month-year {
                font-size: 19px;
            }

            .day-cell {
                font-size: 14px;
                min-height: 44px;
            }
        }

        @media (max-width: 480px) {
            .calendar-dashboard {
                border-radius: 18px;
            }

            .sidebar {
                padding: 18px 14px 16px;
            }

            .main {
                padding: 18px 12px 16px;
            }

            .day-cell {
                font-size: 13px;
                min-height: 38px;
                border-radius: 10px;
            }

            .weekdays {
                font-size: 11px;
            }

            .legend {
                gap: 10px 16px;
            }

            .legend-item {
                font-size: 12px;
            }

            .tip {
                font-size: 13px;
                padding: 12px 14px;
                flex-wrap: wrap;
            }
        }

        /* small extra: hide indicators text on very small screens */
        @media (max-width: 400px) {
            .day-cell .indicators .indicator-dot {
                width: 5px;
                height: 5px;
            }
        }
    </style>
</head>
<body>

    <div class="calendar-dashboard">

        <!-- ===== SIDEBAR ===== -->
        <aside class="sidebar">
            <div class="sidebar-title">📌 Upcoming Events</div>
            <div class="event-list" id="eventList">
                <!-- Populated by JavaScript -->
            </div>
        </aside>

        <!-- ===== MAIN CALENDAR ===== -->
        <main class="main">
            <!-- header -->
            <div class="calendar-header">
                <div class="month-year" id="monthYearDisplay">
                    August <span>2026</span>
                </div>
                <div class="nav-buttons">
                    <button class="nav-btn" id="prevMonthBtn" aria-label="Previous month">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <button class="nav-btn" id="nextMonthBtn" aria-label="Next month">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>

            <!-- weekday names -->
            <div class="weekdays">
                <span>Sun</span>
                <span>Mon</span>
                <span>Tue</span>
                <span>Wed</span>
                <span>Thu</span>
                <span>Fri</span>
                <span>Sat</span>
            </div>

            <!-- days grid -->
            <div class="days-grid" id="daysGrid">
                <!-- Populated by JavaScript -->
            </div>

            <!-- legend -->
            <div class="legend">
                <span class="legend-item"><span class="legend-dot orange"></span> Bill</span>
                <span class="legend-item"><span class="legend-dot green"></span> Payment</span>
                <span class="legend-item"><span class="legend-dot blue"></span> Birthday</span>
                <span class="legend-item"><span class="legend-dot purple"></span> Reminder</span>
                <span class="legend-item"><span class="legend-dot pink"></span> Other</span>
                <span class="legend-item"><span class="legend-dot teal"></span> Trip</span>
                <span class="legend-item"><span class="legend-dot red"></span> Insurance</span>
            </div>

            <!-- tip -->
            <div class="tip">
                <i class="fas fa-lightbulb"></i>
                <span>Tip: Add your bills, payments and important dates to stay on track with your finances.</span>
            </div>
        </main>
    </div>

    <script>
        // ============================================================
        //  DATA
        // ============================================================

        // Events store: each event has date (YYYY-MM-DD), label, type (for colour)
        // The type maps to a CSS class: orange, green, blue, purple, pink, teal, red
        const eventsData = [{
            date: '2026-08-05',
            label: 'Electricity Bill',
            type: 'orange',
            sub: 'Pay electricity bill'
        }, {
            date: '2026-08-12',
            label: 'Salary Receipt',
            type: 'green',
            sub: 'Monthly salary'
        }, {
            date: '2026-08-19',
            label: "Ahmed's Birthday",
            type: 'blue',
            sub: 'Wish him a happy birthday'
        }, {
            date: '2026-08-22',
            label: 'Credit Card',
            type: 'purple',
            sub: 'Pay HBL Credit'
        }, {
            date: '2026-08-27',
            label: 'Health Insurance',
            type: 'red',
            sub: 'Pay annual health insurance'
        }, {
            date: '2026-08-29',
            label: 'Trip to Murree',
            type: 'teal',
            sub: 'Weekend trip'
        }, {
            date: '2026-08-14',
            label: 'Dentist Appointment',
            type: 'pink',
            sub: '2:30 PM'
        }, {
            date: '2026-08-01',
            label: 'Rent Due',
            type: 'orange',
            sub: 'Monthly rent'
        }, {
            date: '2026-08-25',
            label: 'Project Deadline',
            type: 'purple',
            sub: 'Submit report'
        }, {
            date: '2026-08-10',
            label: 'Team Lunch',
            type: 'green',
            sub: '12:30 PM'
        }, {
            date: '2026-08-18',
            label: 'Gym Session',
            type: 'pink',
            sub: '6:00 AM'
        }, {
            date: '2026-08-30',
            label: 'Family Dinner',
            type: 'teal',
            sub: '7:00 PM'
        }, ];

        // ============================================================
        //  STATE
        // ============================================================

        let currentYear = 2026;
        let currentMonth = 7; // 0-based: August = 7

        // DOM refs
        const monthYearDisplay = document.getElementById('monthYearDisplay');
        const daysGrid = document.getElementById('daysGrid');
        const eventList = document.getElementById('eventList');
        const prevBtn = document.getElementById('prevMonthBtn');
        const nextBtn = document.getElementById('nextMonthBtn');

        // ============================================================
        //  HELPERS
        // ============================================================

        function pad(n) { return String(n).padStart(2, '0'); }

        function dateKey(year, month, day) {
            return `${year}-${pad(month + 1)}-${pad(day)}`;
        }

        function getEventsForDate(year, month, day) {
            const key = dateKey(year, month, day);
            return eventsData.filter(e => e.date === key);
        }

        function getMonthEvents(year, month) {
            return eventsData.filter(e => {
                const [y, m] = e.date.split('-').map(Number);
                return y === year && m === month + 1;
            });
        }

        // ============================================================
        //  RENDER CALENDAR
        // ============================================================

        function renderCalendar(year, month) {
            // Update header
            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
                'July', 'August', 'September', 'October', 'November', 'December'
            ];
            monthYearDisplay.innerHTML = `${monthNames[month]} <span>${year}</span>`;

            // First day of month (0 = Sunday)
            const firstDay = new Date(year, month, 1).getDay();
            // Number of days in month
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            // Days in previous month
            const daysInPrevMonth = new Date(year, month, 0).getDate();

            // Build grid
            let html = '';

            // Previous month's trailing days
            const startOffset = firstDay; // 0=Sun … 6=Sat
            const prevMonthYear = month === 0 ? year - 1 : year;
            const prevMonth = month === 0 ? 11 : month - 1;

            for (let i = startOffset - 1; i >= 0; i--) {
                const day = daysInPrevMonth - i;
                const key = dateKey(prevMonthYear, prevMonth, day);
                const events = getEventsForDate(prevMonthYear, prevMonth, day);
                html += buildDayCell(day, 'other-month', events);
            }

            // Current month's days
            for (let day = 1; day <= daysInMonth; day++) {
                const key = dateKey(year, month, day);
                const events = getEventsForDate(year, month, day);
                const isToday = (year === 2026 && month === 7 && day === 8); // Aug 8, 2026 as "today"
                const cls = isToday ? 'today' : '';
                html += buildDayCell(day, cls, events);
            }

            // Next month's leading days
            const totalCells = startOffset + daysInMonth;
            const remaining = (7 - (totalCells % 7)) % 7;
            const nextMonthYear = month === 11 ? year + 1 : year;
            const nextMonth = month === 11 ? 0 : month + 1;

            for (let day = 1; day <= remaining; day++) {
                const key = dateKey(nextMonthYear, nextMonth, day);
                const events = getEventsForDate(nextMonthYear, nextMonth, day);
                html += buildDayCell(day, 'other-month', events);
            }

            daysGrid.innerHTML = html;

            // Render sidebar events (upcoming)
            renderSidebar(year, month);
        }

        // Build a single day cell
        function buildDayCell(day, className, events) {
            // Build indicator dots
            let indicatorsHtml = '';
            if (events.length > 0) {
                // Show up to 3 dots, then "+N"
                const maxDots = 3;
                const shown = events.slice(0, maxDots);
                const extra = events.length - maxDots;

                shown.forEach(ev => {
                    indicatorsHtml += `<span class="indicator-dot ${ev.type}"></span>`;
                });
                if (extra > 0) {
                    indicatorsHtml += `<span style="font-size:9px;color:#7a7f8a;font-weight:500;">+${extra}</span>`;
                }
            }

            return `
                <div class="day-cell ${className}">
                    <span>${day}</span>
                    ${indicatorsHtml ? `<div class="indicators">${indicatorsHtml}</div>` : ''}
                </div>
            `;
        }

        // ============================================================
        //  RENDER SIDEBAR (upcoming events)
        // ============================================================

        function renderSidebar(year, month) {
            // Get all events for this month, sort by date
            const monthEvents = getMonthEvents(year, month);
            // Sort by day
            monthEvents.sort((a, b) => {
                const da = parseInt(a.date.split('-')[2]);
                const db = parseInt(b.date.split('-')[2]);
                return da - db;
            });

            if (monthEvents.length === 0) {
                eventList.innerHTML = `
                    <div style="color:#8b90a0; font-size:14px; padding:8px 0;">
                        No events this month
                    </div>
                `;
                return;
            }

            let html = '';
            monthEvents.forEach(ev => {
                const day = ev.date.split('-')[2];
                // Format day with suffix
                const dayNum = parseInt(day);
                const suffix = ['th', 'st', 'nd', 'rd'][(dayNum % 10 > 3) ? 0 : dayNum % 10] || 'th';
                const dayStr = `${dayNum}${suffix}`;

                html += `
                    <div class="event-item">
                        <span class="event-dot ${ev.type}"></span>
                        <div class="event-info">
                            <div class="event-name">${ev.label}</div>
                            <div class="event-sub">${ev.sub || ''}</div>
                        </div>
                        <span class="event-date-badge">${dayStr}</span>
                    </div>
                `;
            });

            eventList.innerHTML = html;
        }

        // ============================================================
        //  NAVIGATION
        // ============================================================

        function goToPrevMonth() {
            if (currentMonth === 0) {
                currentMonth = 11;
                currentYear--;
            } else {
                currentMonth--;
            }
            renderCalendar(currentYear, currentMonth);
        }

        function goToNextMonth() {
            if (currentMonth === 11) {
                currentMonth = 0;
                currentYear++;
            } else {
                currentMonth++;
            }
            renderCalendar(currentYear, currentMonth);
        }

        // ============================================================
        //  INIT
        // ============================================================

        // Set to August 2026 to match the design
        currentYear = 2026;
        currentMonth = 7; // August

        renderCalendar(currentYear, currentMonth);

        // Event listeners
        prevBtn.addEventListener('click', goToPrevMonth);
        nextBtn.addEventListener('click', goToNextMonth);

        // Keyboard shortcuts (optional)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') goToPrevMonth();
            if (e.key === 'ArrowRight') goToNextMonth();
        });

        console.log('📅 Calendar ready!');
    </script>

</body>
</html>
